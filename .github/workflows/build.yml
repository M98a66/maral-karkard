name: Build Android
on:
  push:
  workflow_dispatch:
env:
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www/lib
          cp index.html www/
          cp node_modules/html2canvas/dist/html2canvas.min.js node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp node_modules/@fontsource/vazirmatn/files/vazirmatn-{arabic,latin}-{400,500,700}-normal.woff2 www/lib/
      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Prepare signing key
        if: env.KS_PASS != '' && env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          sc='''    signingConfigs {
              release {
                  storeFile file("../../release.keystore")
                  storePassword System.getenv("KS_PASS")
                  keyAlias "maral"
                  keyPassword System.getenv("KS_PASS")
              }
          }
          '''
          s=s.replace("    buildTypes {",sc+"    buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }",1)
          s=s.replace("        release {\n            minifyEnabled false","        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",1)
          open(p,'w').write(s)
          PY
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_PASS" ] && [ -n "$KS_B64" ]; then ./gradlew assembleDebug assembleRelease bundleRelease; else ./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: maral-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
