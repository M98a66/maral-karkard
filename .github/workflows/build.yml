name: Build Android
on:
  push:
  workflow_dispatch:
env:
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www/lib
          cp index.html firebase-config.js www/
          cp node_modules/firebase/firebase-{app,auth,firestore}-compat.js www/lib/
          cp node_modules/html2canvas/dist/html2canvas.min.js node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp node_modules/@fontsource/vazirmatn/files/vazirmatn-{arabic,latin}-{400,500,700}-normal.woff2 www/lib/
      - name: Add Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: Prepare signing key
        run: |
          if [ -n "$KS_PASS" ] && [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "SIGN_FILE=../../release.keystore" >> $GITHUB_ENV
            echo "SIGN_PASS=$KS_PASS" >> $GITHUB_ENV
            echo "SIGN_ALIAS=maral" >> $GITHUB_ENV
          else
            echo "SIGN_FILE=../../debug.keystore" >> $GITHUB_ENV
            echo "SIGN_PASS=android" >> $GITHUB_ENV
            echo "SIGN_ALIAS=androiddebugkey" >> $GITHUB_ENV
          fi
      - name: Patch gradle signing
        run: |
          python3 - <<'PY'
          import os
          p='android/app/build.gradle'
          s=open(p).read()
          sc='    signingConfigs {\n        release {\n            storeFile file("%s")\n            storePassword "%s"\n            keyAlias "%s"\n            keyPassword "%s"\n        }\n    }\n' % (os.environ['SIGN_FILE'],os.environ['SIGN_PASS'],os.environ['SIGN_ALIAS'],os.environ['SIGN_PASS'])
          s=s.replace("    buildTypes {",sc+"    buildTypes {\n        debug {\n            signingConfig signingConfigs.release\n        }",1)
          s=s.replace("        release {\n            minifyEnabled false","        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",1)
          open(p,'w').write(s)
          PY
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: maral-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
